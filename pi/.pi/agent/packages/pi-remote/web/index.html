<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Pi Remote</title>
<style>
:root{color-scheme:light;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#fff;--fg:#1a1a1a;--muted:#666;--faint:#999;--surface:#f7f7f7;--surface-2:#eee;--line:#e5e5e5;--focus:#000;--danger:#c00}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer}main{width:min(46rem,100%);min-height:100dvh;margin:0 auto}header{position:fixed;inset:0 0 auto;z-index:10;height:calc(3.25rem + env(safe-area-inset-top));display:flex;align-items:flex-end;padding:0 1rem .8rem;margin:auto;background:#fff;border-bottom:1px solid var(--line);justify-content:flex-end}.connection{display:flex;align-items:center;gap:.4rem;margin-left:auto;color:var(--muted);font-size:.75rem}.dot{width:.42rem;height:.42rem;border-radius:50%;background:var(--faint)}.dot.online{background:#46a758}.dot.busy{background:#e5a000}
#feed{padding:calc(4.75rem + env(safe-area-inset-top)) 1rem calc(7.5rem + env(safe-area-inset-bottom));overflow-wrap:anywhere}.message{position:relative;margin:0 0 2rem}.message.user{width:fit-content;max-width:88%;margin-left:auto;padding:.62rem .82rem;background:var(--surface);border:1px solid var(--line);border-radius:0;white-space:pre-wrap}.message.user.pending{color:var(--muted);border-style:dashed}.message.assistant{font-size:1rem}.message.error{color:var(--danger)}.tool{display:grid;grid-template-columns:1rem minmax(0,1fr) auto;align-items:center;gap:.5rem;min-height:2.25rem;margin:.75rem 0 1.5rem;padding:.45rem .65rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:12px/1.4 ui-monospace,"SFMono-Regular",Consolas,monospace}.tool-indicator{display:grid;width:.75rem;height:.75rem;place-items:center;color:var(--faint)}.tool.running .tool-indicator{border:1px solid var(--faint);border-top-color:var(--fg);border-radius:50%;animation:tool-spin .8s linear infinite}.tool.done .tool-indicator::before{content:"✓";color:var(--fg)}.tool.error .tool-indicator::before{content:"×";color:var(--danger)}.tool-name{overflow:hidden;color:var(--fg);text-overflow:ellipsis;white-space:nowrap}.tool-state{color:var(--muted)}@keyframes tool-spin{to{transform:rotate(360deg)}}.empty,.pairing{max-width:25rem;margin:28dvh auto 0;text-align:center;color:var(--muted)}.pairing{padding:0 1rem}
.markdown{color:var(--fg)}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown h1,.markdown h2,.markdown h3,.markdown h4{margin:1.8em 0 .55em;color:#111;font-weight:600;line-height:1.25;letter-spacing:-.025em}.markdown h1{font-size:1.6rem}.markdown h2{font-size:1.3rem}.markdown h3{font-size:1.08rem}.markdown p{margin:.85em 0}.markdown a{color:#111;text-decoration:underline;text-decoration-color:#999;text-underline-offset:3px}.markdown strong{color:#111;font-weight:600}.markdown ul,.markdown ol{margin:.8em 0;padding-left:1.35rem}.markdown li{margin:.28em 0}.markdown li::marker{color:var(--muted)}.markdown blockquote{margin:1rem 0;padding:.05rem 0 .05rem 1rem;border-left:1px solid #999;color:#555}.markdown code{padding:.12em .32em;border:1px solid var(--line);border-radius:.3rem;background:var(--surface);font:13px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace}.markdown pre{margin:1rem 0;padding:.9rem 1rem;overflow:auto;border:1px solid var(--line);border-radius:.5rem;background:var(--surface)}.markdown pre code{padding:0;border:0;background:none;color:#333}.markdown hr{height:1px;margin:1.5rem 0;border:0;background:var(--line)}.markdown table{display:block;width:100%;margin:1rem 0;overflow-x:auto;border-collapse:collapse;font-size:.875rem}.markdown th,.markdown td{padding:.5rem .75rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.markdown th{color:#111;font-weight:500}.markdown img{max-width:100%;border-radius:.5rem}.markdown input[type=checkbox]{accent-color:#000}
#composer-dock{position:fixed;left:50%;bottom:0;z-index:10;translate:-50% 0;width:min(46rem,100%);background:#fff}.working-indicator{display:none;align-items:center;gap:.5rem;min-height:2.35rem;padding:.45rem 1rem;color:var(--muted);font-size:.75rem}.working-indicator.visible{display:flex}.working-spinner{width:.72rem;height:.72rem;border:1px solid var(--faint);border-top-color:var(--fg);border-radius:50%;animation:tool-spin .8s linear infinite}#composer{padding:.65rem 1rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.input-shell{display:flex;align-items:flex-end;width:100%;min-width:0;border:1px solid var(--line);border-radius:.7rem;background:var(--surface)}textarea{flex:1;width:100%;max-height:10rem;resize:none;padding:.72rem .8rem;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px;line-height:1.45}.composer-actions{display:flex;align-items:center;gap:.4rem;padding:.38rem}.send,.abort{height:2rem;padding:0 .72rem;border:0;border-radius:0;font-size:.78rem;font-weight:600}.send{background:#000;color:#fff;border-radius:.55rem}.send:disabled{background:#ddd;color:#888}.abort{display:none;background:transparent;color:var(--danger);border:1px solid #e7b5b5;border-radius:.55rem}textarea::placeholder{color:#666}:focus-visible{outline:none}@media(max-width:520px){#feed{padding-left:.85rem;padding-right:.85rem}.message.user{max-width:92%}.markdown h1{font-size:1.45rem}.composer-actions{padding-left:0}.send,.abort{padding:0 .62rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.tool.running .tool-indicator,.working-spinner{animation:none;border-color:var(--faint);border-top-color:var(--fg)}}
</style>
</head>
<body>
<main>
<header><div class="connection"><span id="dot" class="dot"></span><span id="status">Connecting</span></div></header>
<section id="feed"><p class="empty">Connecting to session…</p></section>
<div id="composer-dock"><div id="working" class="working-indicator" role="status"><span class="working-spinner" aria-hidden="true"></span><span>Working…</span></div><form id="composer"><div class="input-shell"><textarea id="prompt" rows="1" placeholder="Message Pi" aria-label="Message Pi"></textarea><div class="composer-actions"><button id="abort" class="abort" type="button">Stop</button><button id="send" class="send" type="submit">Send</button></div></div></form></div>
</main>
<script>
const feed=document.querySelector('#feed'),statusEl=document.querySelector('#status'),dot=document.querySelector('#dot'),dock=document.querySelector('#composer-dock'),form=document.querySelector('#composer'),input=document.querySelector('#prompt'),send=document.querySelector('#send'),abort=document.querySelector('#abort'),working=document.querySelector('#working');
let streaming=null,busy=false,renderSequence=0;const markdownSources=new WeakMap(),renderVersions=new WeakMap(),pendingUsers=[];
function scroll(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'auto'}))}
function pairingMessage(text){feed.innerHTML='';const el=document.createElement('div');el.className='pairing';el.textContent=text;feed.append(el);dock.style.display='none';statusEl.textContent='Pairing'}
function userMessage(text){feed.querySelector('.empty')?.remove();const el=document.createElement('div');el.className='message user';el.textContent=text;feed.append(el);scroll();return el}
function assistantMessage(text='',error=false){feed.querySelector('.empty')?.remove();const el=document.createElement('article');el.className='message assistant'+(error?' error':'');const body=document.createElement('div');body.className='markdown';el.append(body);feed.append(el);markdownSources.set(el,text);void renderMessage(el,true);scroll();return el}
async function renderMessage(el,streamingRender=false){const markdown=markdownSources.get(el)||'',version=++renderSequence;renderVersions.set(el,version);try{const r=await fetch('/api/markdown',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({markdown})});if(!r.ok)throw new Error('Markdown render failed');const data=await r.json();if(renderVersions.get(el)!==version)return;el.querySelector('.markdown').innerHTML=data.html;if(streamingRender)scroll()}catch{if(renderVersions.get(el)===version)el.querySelector('.markdown').textContent=markdown}}
function scheduleRender(el){clearTimeout(el._renderTimer);el._renderTimer=setTimeout(()=>void renderMessage(el,true),45)}
function setBusy(value){busy=value;dot.className='dot '+(value?'busy':'online');statusEl.textContent=value?'Working':'Connected';working.classList.toggle('visible',value);abort.style.display=value?'block':'none'}
function toolStart(event){const el=document.createElement('div');el.className='tool running';el.id='tool-'+event.id;const indicator=document.createElement('span'),name=document.createElement('span'),state=document.createElement('span');indicator.className='tool-indicator';indicator.setAttribute('aria-hidden','true');name.className='tool-name';name.textContent=event.name;state.className='tool-state';state.textContent='Running';el.append(indicator,name,state);feed.append(el);scroll()}
function toolEnd(event){const el=document.getElementById('tool-'+event.id);if(!el)return;el.classList.remove('running');el.classList.add(event.error?'error':'done');const state=el.querySelector('.tool-state');if(state)state.textContent=event.error?'Failed':'Complete'}
function apply(event){switch(event.type){case 'state':setBusy(event.busy);break;case 'user':{const pending=pendingUsers.find(item=>item.text===event.text);if(pending){pending.el.classList.remove('pending');pendingUsers.splice(pendingUsers.indexOf(pending),1)}else userMessage(event.text);break}case 'assistant_start':streaming=assistantMessage();break;case 'assistant_delta':if(!streaming)streaming=assistantMessage();markdownSources.set(streaming,(markdownSources.get(streaming)||'')+event.text);scheduleRender(streaming);break;case 'assistant_end':if(streaming){clearTimeout(streaming._renderTimer);markdownSources.set(streaming,event.text||markdownSources.get(streaming)||'');streaming.classList.toggle('error',!!event.error);void renderMessage(streaming)}else if(event.text)assistantMessage(event.text,event.error);streaming=null;break;case 'tool_start':toolStart(event);break;case 'tool_end':toolEnd(event);break}
}
async function pair(){const fragment=location.hash.slice(1),secret=fragment.startsWith('pair=')?new URLSearchParams(fragment).get('pair'):fragment;if(!secret)return false;pairingMessage('Pairing this browser…');const r=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({secret})});if(!r.ok)throw new Error((await r.json()).error||'Pairing failed');history.replaceState(null,'',location.pathname+location.search);return true}
async function load(){const r=await fetch('/api/snapshot');if(r.status===401){pairingMessage('Access denied. Scan the current Pi Remote QR code to pair this browser.');return false}if(!r.ok)throw new Error('Unable to load session');const data=await r.json();feed.textContent='';dock.style.display='block';for(const item of data.messages)item.role==='user'?userMessage(item.text):assistantMessage(item.text,item.error);if(!data.messages.length)feed.innerHTML='<p class="empty">Start the conversation from either device.</p>';setBusy(data.busy);scroll();return true}
function connect(){const events=new EventSource('/api/events');events.onopen=()=>setBusy(busy);events.onmessage=e=>apply(JSON.parse(e.data));events.onerror=()=>{dot.className='dot';statusEl.textContent='Reconnecting'}}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;send.disabled=true;input.value='';input.style.height='auto';const el=userMessage(text);el.classList.add('pending');const pending={text,el};pendingUsers.push(pending);try{const r=await fetch('/api/prompt',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error((await r.json()).error||'Request failed');el.classList.remove('pending')}catch(e){pendingUsers.splice(pendingUsers.indexOf(pending),1);el.remove();input.value=text;alert(e.message)}finally{send.disabled=false;input.focus()}});
abort.addEventListener('click',()=>fetch('/api/abort',{method:'POST'}));input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
(async()=>{try{await pair();if(await load())connect()}catch(e){dot.className='dot';statusEl.textContent='Denied';pairingMessage(e.message)}})();
</script>
</body>
</html>
